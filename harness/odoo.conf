; ==============================================================================
; DISPOSABLE LOCAL INTEGRATION HARNESS — NEVER PRODUCTION.
; Well-known throwaway admin master password ("master"), list_db exposed, weak
; throwaway db credentials, single-process. Anyone on the host who knows the
; master password can create/drop databases. Do NOT expose
; this to a network you don't fully control, and never point it at real data.
; ==============================================================================
;
; This file is a TEMPLATE. The entrypoint renders it with `envsubst` so the db
; credentials come from the compose `environment:` block (which come from the
; harness .env defaults) instead of being hardcoded — one source of truth.
[options]
db_host = ${ODOO_HARNESS_DB_HOST}
db_port = ${ODOO_HARNESS_DB_PORT}
db_user = ${ODOO_HARNESS_DB_USER}
db_password = ${ODOO_HARNESS_DB_PASSWORD}
; Fresh source lives at /opt/odoo (see Dockerfile). `base` auto-loads from
; /opt/odoo/odoo/addons; standard modules come from /opt/odoo/addons.
addons_path = /opt/odoo/addons
data_dir = /var/lib/odoo
; Single-process — deterministic for RPC integration tests.
workers = 0
; Disposable harness conveniences.
list_db = True
; Master password gating db-management endpoints (create/drop/dump/restore/…).
; Templated from ${ODOO_HARNESS_MASTER_PASSWORD} (default "master") so the db
; integration suite can exercise the master-gated ops. DISPOSABLE LOCAL ONLY.
admin_passwd = ${ODOO_HARNESS_MASTER_PASSWORD}
