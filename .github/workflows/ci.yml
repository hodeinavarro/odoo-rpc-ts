name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: check, test, pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        run: |
          npm install --global pnpm@11.16.0 --ignore-scripts
          test "$(pnpm --version)" = "11.16.0"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      # minimumReleaseAge (pnpm's supply-chain cooldown) can refuse freshly
      # published versions in the lockfile on CI; --config.minimumReleaseAge=0
      # disables the cooldown for this deterministic, frozen-lockfile install.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts --config.minimumReleaseAge=0

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build and inspect package
        run: pnpm pack --dry-run

  integration:
    name: integration (${{ matrix.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ["16.0", "17.0", "18.0", "19.0"]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        run: |
          npm install --global pnpm@11.16.0 --ignore-scripts
          test "$(pnpm --version)" = "11.16.0"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts --config.minimumReleaseAge=0

      # A stable branch name would leave the source-fetching Docker layer cached
      # after upstream Odoo advances. Resolve it to an immutable revision so the
      # cache is both fresh and reproducible.
      - name: Resolve upstream Odoo revision
        id: odoo
        env:
          ODOO_VERSION: ${{ matrix.version }}
        run: |
          read -r sha _ <<< "$(
            git ls-remote --exit-code https://github.com/odoo/odoo \
              "refs/heads/${ODOO_VERSION}"
          )"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Odoo ${ODOO_VERSION}: $sha"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build cached Odoo ${{ matrix.version }} harness image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          # Keep the Buildx summary, but do not spend artifact storage on the
          # downloadable build record in addition to the layer cache.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: harness
          file: harness/Dockerfile
          load: true
          pull: true
          tags: odoo-rpc-ts-harness:${{ matrix.version }}
          build-args: |
            ODOO_HARNESS_BASE=odoo:${{ matrix.version }}
            ODOO_HARNESS_REF=${{ steps.odoo.outputs.sha }}
          cache-from: type=gha,scope=odoo-harness-${{ matrix.version }}
          cache-to: type=gha,scope=odoo-harness-${{ matrix.version }},mode=min
          github-token: ${{ github.token }}

      - name: Bring up the Odoo ${{ matrix.version }} harness
        run: pnpm harness up ${{ matrix.version }}

      # The harness writes a .env-format state file; export every key into the
      # job env so the integration runner sees ODOO_URL/ODOO_DB/... as vars.
      - name: Load harness state into the environment
        env:
          HARNESS_STATE: harness/.state/${{ matrix.version }}/env
        run: |
          while IFS='=' read -r key value; do
            case "$key" in
              *_PASSWORD|*_API_KEY) echo "::add-mask::$value" ;;
            esac
          done < "$HARNESS_STATE"
          cat "$HARNESS_STATE" >> "$GITHUB_ENV"

      - name: Integration tests
        run: pnpm test:integration

      - name: Tear down the harness
        if: always()
        run: pnpm harness down ${{ matrix.version }}
