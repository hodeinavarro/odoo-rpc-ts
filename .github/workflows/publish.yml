name: Publish package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: validate and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        run: |
          npm install --global pnpm@11.12.0 --ignore-scripts
          test "$(pnpm --version)" = "11.12.0"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm trusted publishing support
        shell: bash
        run: |
          npm_version="$(npm --version)"
          minimum_version="11.5.1"
          first="$(printf '%s\n%s\n' "${minimum_version}" "${npm_version}" | sort -V | head -n 1)"
          test "${first}" = "${minimum_version}"

      # minimumReleaseAge protects ordinary installs. Publishing validates the
      # exact frozen lockfile and deliberately bypasses the age gate so a fresh,
      # reviewed dependency release cannot make the release job nondeterministic.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --config.minimumReleaseAge=0

      - name: Verify release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          expected="v$(node --print "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "${expected}"

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Publish immutable package
        # npm exchanges the workflow's OIDC identity for a short-lived publish
        # credential. The public repository and package produce a provenance
        # attestation; no registry token or persisted Git credential is used.
        run: npm publish --access public --provenance
